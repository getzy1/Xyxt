<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Here to Continue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
 
    body {
      min-height: 100vh;
      background: #100d10;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
 
    .landing {
      width: 100%;
      max-width: 480px;
      padding: 35px 20px;
      background: #1b151a;
      border: 1px solid #39232d;
      border-radius: 18px;
      box-shadow: 0 0 35px #e51d4320;
    }
 
    .tag {
      color: #ff405f;
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 14px;
      margin-bottom: 28px;
    }
 
    h1 {
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.2;
      font-weight: 900;
      margin-bottom: 15px;
    }
 
    .subtitle {
      color: #c9c3c7;
      font-size: 16px;
      line-height: 1.6;
    }
 
    .arrow {
      font-size: 75px;
      color: #ffdf35;
      margin: 12px 0 18px;
      animation: bounce 0.7s infinite alternate;
      text-shadow: 0 0 18px #ffdf3580;
    }
 
    .watch-btn {
      display: block;
      width: 100%;
      padding: 21px 12px;
      border-radius: 12px;
      background: #ed1745;
      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: 900;
      border: 2px solid #ff6482;
      box-shadow: 0 0 22px #ed174550;
      animation: pulse 1.2s infinite;
    }
 
    .watch-btn:active {
      transform: scale(0.97);
    }
 
    .hint {
      margin-top: 22px;
      color: #aaa0a6;
      font-size: 13px;
    }
 
    @keyframes bounce {
      from { transform: translateY(-5px); }
      to { transform: translateY(12px); }
    }
 
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 10px #ed174530; }
      50% { box-shadow: 0 0 28px #ed1745b0; }
    }
 
    @media (prefers-reduced-motion: reduce) {
      .arrow, .watch-btn {
        animation: none;
      }
    }
  </style>
  <link rel="me" href="https://www.blogger.com/profile/02881604410527072183">
  <meta name="google-adsense-platform-account" content="ca-host-pub-1556223355139109">
  <meta name="google-adsense-platform-domain" content="blogspot.com">
 </head>
 <body>
  <main class="landing">
   <div class="tag"></div>
   <h1>CLICK HERE
    <br>
    TO SEE MORE</h1>
   <p class="subtitle">Tap the button below to continue.</p>
   <div class="arrow" aria-hidden="true">⬇</div>
   <!-- Replace the URL below with your destination link -->
   <a class="watch-btn" href="https://rm358.com/4/11993115?var=" target="_blank" rel="noopener noreferrer"> ▶ CLICK HERE TO CONTINUE </a>
   <p class="hint">Tap the button above to continue</p>
  </main>
 </body>
</html>
